pluginGroup = io.github.marcomaes.mobiletestbench
pluginName = Mobile Test Bench
pluginVersion = 1.0.1

# 253 = 2025.3. The plugin only depends on com.intellij.modules.platform,
# so it runs in IntelliJ IDEA, WebStorm, PyCharm, Android Studio, etc.
pluginSinceBuild = 253
platformVersion = 2025.3.6.1

grpcVersion = 1.84.0
# Decision (release readiness): align with grpc-java. grpc-protobuf 1.84.0 declares
# protobuf-java 3.25.9, and the IDE bundles protobuf-java 3.24.4. protobuf rules say the
# generated code must not be newer than the runtime, and 4.x gencode calls
# RuntimeVersion, which does not exist in the IDE copy (NoClassDefFoundError if that copy
# were loaded). With 3.25.9 the gencode works with both. Covered by compilation and the
# unit tests only; the emulator gRPC stream/input path was not re-run at runtime.
protobufVersion = 3.25.9

# The IntelliJ Platform ships its own Kotlin stdlib.
kotlin.stdlib.default.dependency = false

org.gradle.caching = true
# The protobuf Gradle plugin is not fully configuration-cache friendly yet.
org.gradle.configuration-cache = false
org.gradle.jvmargs = -Xmx2g
